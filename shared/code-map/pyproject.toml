[project]
name = "code-map"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dagger-io",
    "pydantic[email]>=2.11.0",
    "ais-dagger-agents-config>=0.1.0,<0.2.0",
    "pyyaml>=6.0.3",
]


[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }
